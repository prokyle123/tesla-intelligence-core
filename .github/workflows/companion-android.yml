name: companion-android

on:
  push:
    branches: [main]
    paths:
      - 'companion/android/**'
      - '.github/workflows/companion-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion/android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build companion APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare release files
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Tesla-Intelligence-Core-Companion-v0.3.0-debug.apk
          sha256sum Tesla-Intelligence-Core-Companion-v0.3.0-debug.apk > Tesla-Intelligence-Core-Companion-v0.3.0-debug.apk.sha256
          zip -qr Tesla-Intelligence-Core-Companion-v0.3.0-source.zip . -x '.gradle/*' 'app/build/*' '*.apk' '*.sha256' '*.zip'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tesla-Intelligence-Core-Companion-v0.3.0
          path: |
            companion/android/Tesla-Intelligence-Core-Companion-v0.3.0-debug.apk
            companion/android/Tesla-Intelligence-Core-Companion-v0.3.0-debug.apk.sha256
            companion/android/Tesla-Intelligence-Core-Companion-v0.3.0-source.zip

      - name: Attach companion build to current public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.8.27.6 \
            Tesla-Intelligence-Core-Companion-v0.3.0-debug.apk \
            Tesla-Intelligence-Core-Companion-v0.3.0-debug.apk.sha256 \
            Tesla-Intelligence-Core-Companion-v0.3.0-source.zip \
            --clobber \
            -R "$GITHUB_REPOSITORY"

      - name: Update release notes for companion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.8.27.6 -R "$GITHUB_REPOSITORY" --json body -q .body > /tmp/release-body.md
          if ! grep -q "Android Companion v0.3.0" /tmp/release-body.md; then
            cat >> /tmp/release-body.md <<'EOF'

          ## Android Companion v0.3.0

          The release now also includes the Tesla Intelligence Core Android companion:

          - Local LAN -> private Tailnet -> optional public HTTPS failover
          - current Winter Readiness / Events / Neural Engine / Truth Lab / Thermal History views
          - AI Lab, Models, Data Quality, Sources, Events, Production and History navigation
          - full-screen Neural Atlas with the S25/aspect-ratio fixes preserved
          - Tesla in-car browser guidance for the optional Funnel -> PIN gateway -> dashboard route

          See the repository README and `docs/TESLA_BROWSER.md` for setup and security notes.
          EOF
            gh release edit v0.8.27.6 -R "$GITHUB_REPOSITORY" --notes-file /tmp/release-body.md
          fi
