name: Hive public analytics

on:
  push:
    branches: [main]
    paths:
      - 'docs/hive/**'
      - '.github/workflows/hive-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hive-public-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout reviewed public content
        uses: actions/checkout@v4
      - name: Validate public JSON is aggregate-only
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/hive/network.json').read_text())
          assert d['schema']=='ghost-hive-public-v1'
          assert not (set(d) & {'vin','car_id','gps','latitude','longitude',
                                'raw_json','token','secret','routes','model_weights'})
          assert isinstance(d['reporting_nodes'],int)
          assert d['reporting_nodes']>=0
          assert d['private_group_threshold']>=10
          for m in d['monthly']:
              assert set(m)=={'month','label','status','reporting_nodes',
                              'predictions_checked','mean_error_f'}
              if m['status']!='SHARED_GROUP':
                  assert m['reporting_nodes'] is None
                  assert m['predictions_checked'] is None
                  assert m['mean_error_f'] is None
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/hive
      - name: Publish sanitized Hive dashboard
        id: deployment
        uses: actions/deploy-pages@v4
