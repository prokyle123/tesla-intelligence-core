name: companion-screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/companion-screenshots.yml'
      - 'companion/android/**'

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build companion
        working-directory: companion/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture companion screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            python3 -m http.server 8766 --directory web/templates >/tmp/tic-demo-http.log 2>&1 &
            adb install -r companion/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.ghost.tesla.mobile
            adb shell am start -n com.ghost.tesla.mobile/.MainActivity --es tic_local http://10.0.2.2:8766
            sleep 10
            mkdir -p docs/images/companion
            adb exec-out screencap -p > docs/images/companion/companion-v021-home.png
            adb shell am force-stop com.ghost.tesla.mobile
            adb shell am start -n com.ghost.tesla.mobile/.MainActivity --es tic_local http://10.0.2.2:8766 --es tic_view neural4
            sleep 8
            adb exec-out screencap -p > docs/images/companion/companion-v021-neural.png

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/companion/companion-v021-home.png docs/images/companion/companion-v021-neural.png
          git commit -m "Add Companion v0.2.1 emulator screenshots" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
