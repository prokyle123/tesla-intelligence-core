name: smoke
on:
  push:
  pull_request:
jobs:
  python-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python source
        run: python -m compileall -q ghost_tesla_ai
      - name: Secret-shaped string sanity check
        run: |
          ! grep -RIE '(tail[0-9a-f]{6,}\.ts\.net|5YJ[0-9A-Z]{14}|sk-[A-Za-z0-9]{20,}|Bearer [A-Za-z0-9._-]{20,})' --exclude-dir=.git .
