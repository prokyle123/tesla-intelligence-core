name: smoke
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python source
        run: |
          python -m compileall -q ghost_tesla_ai
          python -m compileall -q genesis

      - name: Validate shell scripts
        run: |
          bash -n install.sh
          bash -n update.sh
          bash -n uninstall.sh
          bash -n scripts/genesis_stage_preview.sh
          bash -n scripts/genesis_preview_upgrade.sh
          bash -n scripts/hive_preview.sh

      - name: Verify public installer repository
        run: |
          grep -q 'prokyle123/tesla-intelligence-core.git' install.sh
          ! grep -R 'prokyle123/ghost-tesla-ai' --exclude-dir=.git --exclude=smoke.yml .

      - name: v1 package completeness
        run: python3 scripts/release_preflight.py --strict

      - name: Portable evaluator and trip regression tests
        run: python3 -m unittest discover -s tests -p 'test_release_contract.py' -v

      - name: Install Flask for isolated GENESIS route tests
        run: python3 -m pip install 'Flask>=3,<4'

      - name: GENESIS offline research and privacy regression tests
        run: python3 -m unittest discover -s tests -p 'test_genesis*.py' -v

      - name: GENESIS independent stage contract
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          GHOST_GENESIS_PREFIX="$tmp/genesis" bash scripts/genesis_stage_preview.sh stage
          test -f "$tmp/genesis/current/genesis/product_core.py"
          test -f "$tmp/genesis/current/genesis/workspace.py"
          test ! -e "$tmp/genesis/state/product.sqlite3"
          GHOST_GENESIS_PREFIX="$tmp/genesis" bash scripts/genesis_stage_preview.sh status
          test -L "$tmp/genesis/current"

      - name: Validate GENESIS dashboard JavaScript
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Script(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.collect = False
                  self.parts = []
              def handle_starttag(self, tag, attrs):
                  self.collect = tag == "script" and not dict(attrs).get("src")
              def handle_endtag(self, tag):
                  if tag == "script":
                      self.collect = False
              def handle_data(self, data):
                  if self.collect:
                      self.parts.append(data)
          for name in ("genesis_dashboard.html", "hive_analytics.html"):
              parser = Script()
              parser.feed((Path("genesis/web") / name).read_text())
              assert len(parser.parts) == 1, f"Expected one embedded script in {name}"
              Path("/tmp/" + name + ".js").write_text(parser.parts[0])
          PY
          node --check /tmp/genesis_dashboard.html.js
          node --check /tmp/hive_analytics.html.js
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.inside=False
                  self.data=[]
              def handle_starttag(self,tag,attrs):
                  if tag=="script": self.inside=True
              def handle_endtag(self,tag):
                  if tag=="script": self.inside=False
              def handle_data(self,data):
                  if self.inside: self.data.append(data)
          p=Scripts()
          p.feed(Path("web/templates/hive.html").read_text())
          assert len(p.data)==1, "One local embedded integration script required"
          Path("/tmp/ghost-hive-integrated.js").write_text(p.data[0])
          PY
          node --check /tmp/ghost-hive-integrated.js

      - name: Check committed diff whitespace
        run: git diff --check HEAD~1 HEAD

      - name: Verify published screenshots are real review-approved assets
        run: |
          sha256sum --check docs/images/v1.sha256
          python3 - <<'PY'
          from pathlib import Path
          files=sorted(Path("docs/images/v1").glob("v1-*.webp"))
          assert len(files)==9, f"Expected 9 gallery images, found {len(files)}"
          for f in files:
              b=f.read_bytes()
              assert len(b)>15000 and b[:4]==b"RIFF" and b[8:12]==b"WEBP", f"Not a valid WebP screenshot: {f}"
          print("Verified",len(files),"dashboard photos")
          PY

      - name: Check tracked public files for identifying addresses and secrets
        run: python3 scripts/check_public_exposure.py
