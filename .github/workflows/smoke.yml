name: smoke
on:
  push:
  pull_request:

jobs:
  source-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python source
        run: python -m compileall -q ghost_tesla_ai

      - name: Validate shell scripts
        run: |
          bash -n install.sh
          bash -n update.sh
          bash -n uninstall.sh

      - name: Verify public installer repository
        run: |
          grep -q 'prokyle123/tesla-intelligence-core.git' install.sh
          ! grep -R 'prokyle123/ghost-tesla-ai' --exclude-dir=.git --exclude=smoke.yml .

      - name: v1 package completeness
        run: python3 scripts/release_preflight.py --strict

      - name: Portable evaluator and trip regression tests
        run: python3 -m unittest discover -s tests -p 'test_release_contract.py' -v

      - name: Check committed diff whitespace
        run: git diff --check HEAD~1 HEAD

      - name: Secret-shaped string sanity check
        run: |
          ! grep -RIE '(tail[0-9a-f]{6,}\.ts\.net|5YJ[0-9A-Z]{14}|sk-[A-Za-z0-9]{20,}|Bearer [A-Za-z0-9._-]{20,})' --exclude-dir=.git .
