name: smoke
on:
  push:
  pull_request:

jobs:
  source-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python source
        run: python -m compileall -q ghost_tesla_ai

      - name: Validate shell scripts
        run: |
          bash -n install.sh
          bash -n update.sh
          bash -n uninstall.sh

      - name: Verify public installer repository
        run: |
          grep -q 'prokyle123/tesla-intelligence-core.git' install.sh
          ! grep -R 'prokyle123/ghost-tesla-ai' --exclude-dir=.git .

      - name: Secret-shaped string sanity check
        run: |
          ! grep -RIE '(tail[0-9a-f]{6,}\.ts\.net|5YJ[0-9A-Z]{14}|sk-[A-Za-z0-9]{20,}|Bearer [A-Za-z0-9._-]{20,})' --exclude-dir=.git .
