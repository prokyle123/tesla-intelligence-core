<text class="sub muted" x="44" y="88">Local-first vehicle learning | Winter readiness remains the central mission</text>
<rect x="1010" y="32" width="120" height="34" rx="17" fill="#103f39" stroke="#24866c"/>
<text x="1070" y="54" font-size="14" text-anchor="middle" class="tag">v1 scope</text>

<rect class="card" x="44" y="133" width="315" height="122" rx="16"/>
<text class="headline" x="67" y="174">Vehicle observations</text>
<text class="small muted" x="67" y="204">Tessie or TeslaMate | SOC, pack, power</text>
<text class="small muted" x="67" y="229">All drives, charging, parking, Sentry</text>
<rect class="card" x="44" y="290" width="315" height="122" rx="16"/>
<text class="headline" x="67" y="331">Environmental context</text>
<text class="small muted" x="67" y="361">Outside forecast | 3h / 6h / 12h</text>
<text class="small muted" x="67" y="386">Cold soak | measured temperatures</text>

<path class="edge" d="M359 194 H406 V251 H441"/><path class="edge" d="M359 350 H406 V292 H441"/>
<rect class="card" x="441" y="190" width="308" height="175" rx="17"/>
<text class="headline" x="465" y="230">Private local history</text>
<text class="small muted" x="465" y="257">SQLite events and telemetry</text>
<text class="small muted" x="465" y="282">Trip chains and route evidence</text>
<text class="small muted" x="465" y="307">Charge-rate and thermal retention</text>
<text class="small muted" x="465" y="332">No raw data published to GitHub</text>

<path class="edge" d="M749 255 H807 V194 H837"/>
<path class="edge" d="M749 296 H807 V359 H837"/>
