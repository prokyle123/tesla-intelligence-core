<text class="headline" x="862" y="171">Predictive models</text>
<text class="small muted" x="862" y="201">Thermal, charge, SOC and trip energy</text>
<text class="small muted" x="862" y="227">Challenger / governor safeguards</text>
<rect class="card" x="837" y="294" width="298" height="132" rx="16"/>
<text class="headline" x="862" y="334">Independent evaluation</text>
<text class="small muted" x="862" y="364">Forecast quality | trip quality</text>
<text class="small muted" x="862" y="390">Completed journeys and uncertainty</text>

<path class="edge" d="M989 261 V293"/>
<path class="edge" d="M988 426 V457 H587 V479"/>
<rect class="card" x="45" y="480" width="1090" height="117" rx="17"/>
<text class="headline" x="71" y="523">Read-only dashboards: winter readiness, forecast accuracy, trip quality and vehicle sensors</text>
<text class="small muted" x="71" y="554">Automatic services and scheduled shadow learners | No Tesla climate, charge, lock or driving control commands</text>
<text class="small tag" x="71" y="578">Learning evidence is separated from proven accuracy; every-trip usage is included.</text>
