<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="650" viewBox="0 0 1180 650" role="img" aria-label="Tesla Intelligence Core v1 architecture: Tesla telemetry and outdoor weather feed local history, thermal and trip intelligence, prediction models, independent quality checks and read-only dashboards">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06131b"/><stop offset="1" stop-color="#0a2534"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e2c3d"/><stop offset="1" stop-color="#0a1d29"/></linearGradient>
  <style>text{font-family:Inter,Arial,sans-serif;fill:#eaf8fc}.muted{fill:#91b1c0}.title{font-size:31px;font-weight:800}.headline{font-size:22px;font-weight:750}.small{font-size:14px}.sub{font-size:15px}.tag{fill:#61e3b0;font-weight:700}.edge{stroke:#397389;stroke-width:3;fill:none;stroke-linecap:round}.card{fill:url(#card);stroke:#2b6077;stroke-width:1.6}</style>
</defs>
<rect width="1180" height="650" rx="28" fill="url(#bg)"/>
<rect x="0" y="0" width="10" height="650" rx="5" fill="#ffc15c"/>
